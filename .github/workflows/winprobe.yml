# Probe: can Rust target x86_64-pc-cygwin on a GitHub Windows runner, next to the C winws2
# built the upstream way? (temporary, windivert branch)
name: winprobe
on:
  push:
    branches: [windivert]
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: rs }
      - name: Cygwin (upstream snapshot)
        uses: cygwin/cygwin-install-action@v4
        with:
          platform: x86_64
          site: http://ctm.crouchingtigerhiddenfruitbat.org/pub/cygwin/circa/64bit/2024/01/30/231215
          check-sig: 'false'
          packages: gcc-core make zlib-devel wget patch pkg-config unzip
      - name: LuaJIT (upstream recipe)
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: >-
          export MAKEFLAGS=-j$(nproc) &&
          wget -q https://github.com/openresty/luajit2/archive/refs/tags/v2.1-20250826.tar.gz &&
          tar -xzf v2.1-20250826.tar.gz &&
          make -C luajit2-2.1-20250826 BUILDMODE=static XCFLAGS="-DLUAJIT_USE_SYSMALLOC -DLUAJIT_DISABLE_FFI -ffat-lto-objects" TARGET_CFLAGS="-Os -flto=auto -ffunction-sections -fdata-sections" TARGET_LDFLAGS="-Wl,--gc-sections -flto=auto" &&
          make -C luajit2-2.1-20250826 install
      - name: C winws2 (zapret2 31b2450 + nfqws2-keenetic fastpath patch)
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: >-
          export MAKEFLAGS=-j$(nproc) &&
          wget -qO z.tgz https://codeload.github.com/bol-van/zapret2/tar.gz/31b245059d18a4ef939b87ef7de7588ebf490ed3 &&
          mkdir z && tar -xzf z.tgz -C z --strip-components=1 &&
          wget -qO fp.patch https://raw.githubusercontent.com/nfqws/nfqws2-keenetic/master/patches/001-tls-reasm-fastpath.patch &&
          patch -p1 -d z < fp.patch &&
          make -C z/nfq2 cygwin &&
          ls -la z/nfq2/winws2.exe && cp /usr/bin/cygwin1.dll z/nfq2/ &&
          wget -qO wd.zip https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip &&
          unzip -qj wd.zip "*/x64/WinDivert.dll" "*/x64/WinDivert64.sys" -d z/nfq2 &&
          cd z/nfq2 && ls -la && cygcheck ./winws2.exe | tail -15;
          { ./winws2.exe --version; echo "rc=$?"; } &&
          { ./winws2.exe --wf-tcp-out=443 --wf-udp-out=443 --wf-save=f.txt; echo "rc=$?"; cat f.txt; echo; } &&
          { ./winws2.exe --dry-run --wf-tcp-out=443 --debug=1 2>&1 | tail -4; } &&
          { timeout 20 ./winws2.exe --wf-tcp-out=443 --intercept=0 --debug=1 2>&1 | tail -8; echo "rc=$?"; } &&
          { timeout 30 ./winws2.exe --wf-tcp-out=443 --fuzz=200 --debug=1 --lua-init=@../lua/zapret-lib.lua 2>&1 | tail -4; echo "rc=$?"; } || true
      - name: Rust x86_64-pc-cygwin hello
        shell: pwsh
        run: |
          rustup toolchain install 1.100.0 --profile minimal -c rust-src
          cargo +1.100.0 new hello
          cd hello
          Add-Content src/main.rs 'unsafe extern "C" { fn getpid() -> i32; } #[allow(dead_code)] fn pid() -> i32 { unsafe { getpid() } }'
          $env:RUSTC_BOOTSTRAP = "1"
          # Cygwin 3.4 (the upstream snapshot, last with Windows 7 support) lacks this; std only uses it
          # for Command::current_dir with posix_spawn, which the program never does
          Set-Content stub.c '#include <errno.h>
          int posix_spawn_file_actions_addchdir_np(void *a, const char *p) { (void)a; (void)p; return ENOSYS; }'
          C:\cygwin\bin\gcc.exe -c -O2 -o stub.o stub.c
          $env:CARGO_TARGET_X86_64_PC_CYGWIN_RUSTFLAGS = "-C link-arg=$((Get-Location).Path)\stub.o"
          $env:CARGO_TARGET_X86_64_PC_CYGWIN_LINKER = "C:\cygwin\bin\gcc.exe"
          cargo +1.100.0 build --release --target x86_64-pc-cygwin '-Zbuild-std=std,panic_abort' 2>&1 | Select-Object -Last 25
          Get-ChildItem target\x86_64-pc-cygwin\release\*.exe
          C:\cygwin\bin\bash.exe -lc "cd '$(Get-Location)'; ./target/x86_64-pc-cygwin/release/hello.exe"

[package]
name = "nfqws2"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Rust port of zapret2 nfq2 (nfqws2), Linux NFQUEUE target"
license = "MIT"

[[bin]]
name = "nfqws2"
path = "src/main.rs"

[dependencies]
libc = "0.2"
indexmap = "2"
mlua = { version = "0.10", features = ["luajit"] }
flate2 = { version = "1", default-features = false, features = ["zlib"] }
aes = "0.8"
ghash = "0.5"
libz-sys = { version = "1", default-features = false, features = ["libc"] }
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"

[profile.release]
opt-level = 2

[build-dependencies]
cc = "1"
